// Dev-server setup shared verbatim by every mod from this template: the runServer/stopServer
// lifecycle helpers, the sane-defaults seeding of `run/` and `run/client`, and the optional Quilt
// run. Nothing here is mod-specific — it only reads `project.mod_id`. `build.gradle` pulls it in
// with `apply from:`.
//
// To drop Quilt support entirely: delete the QuiltMC repo, the `quiltLoader` configuration and its
// dependencies, the `loom { runs { … } }` block, and the two Quilt tasks below (and the `quilt_*`
// properties from gradle.properties).
// To fall back to Loom's bare `run/`: delete the "Dev-server defaults" section and the
// `dependsOn 'configureRunServer'` wiring.

repositories {
	maven {
		// Quilt Loader, pulled in only by the optional `runQuiltServer` task.
		name = 'QuiltMC'
		url = 'https://maven.quiltmc.org/repository/release'
	}
}

configurations {
	// Consumed only by `runQuiltServer`, which swaps it in for fabric-loader. Kept off every other
	// classpath so a normal build never sees Quilt Loader.
	quiltLoader
}

dependencies {
	// For `runQuiltServer` only. Quilt Loader loads Fabric mods natively; this lets a Fabric build be
	// smoke-tested under Quilt without a separate project. Its runtime libraries live in the loader's
	// installer manifest (quilt-loader-<ver>.json), not in maven metadata, so Loom won't pull them in
	// the way it does for fabric-loader — mirror that list here and refresh it when bumping the version.
	quiltLoader "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
	quiltLoader "net.fabricmc:sponge-mixin:${project.quilt_sponge_mixin_version}"
	quiltLoader "org.quiltmc:quilt-json5:${project.quilt_json5_version}"
	quiltLoader "org.quiltmc:quilt-config:${project.quilt_config_version}"
	quiltLoader "org.ow2.asm:asm:${project.quilt_asm_version}"
	quiltLoader "org.ow2.asm:asm-analysis:${project.quilt_asm_version}"
	quiltLoader "org.ow2.asm:asm-commons:${project.quilt_asm_version}"
	quiltLoader "org.ow2.asm:asm-tree:${project.quilt_asm_version}"
	quiltLoader "org.ow2.asm:asm-util:${project.quilt_asm_version}"
	quiltLoader "io.github.llamalad7:mixinextras-fabric:${project.quilt_mixinextras_version}"
}

def devRunDir = 'run'
def quiltRunDir = 'run-quilt'
// How long stopServer waits for a dev server to shut down before giving up.
def stopRequestTimeoutSeconds = 30

// Loom writes one launch config per project, so its path narrows a process to this checkout.
// Matching on the main class or on 'runServer' would also match a sibling mod's server in the same
// workspace, and matching on the port would miss a reconfigured one. The extra -D marker on the
// Quilt run (set below) is what tells the two apart; it must stay a valid -D system property.
def loomLaunchMarker = project.loomLaunchConfig

// runClient passes the same launch config as runServer, so the path alone also matches this
// checkout's dev client — which stopServer would then ask to exit, taking the client down with the
// server and reporting its pid as the one that ignored the request. Loom sets the environment on
// every run, so requiring it is what separates the two.
def serverEnvMarker = '-Dfabric.dli.env=server'
def quiltServerMarker = "-D${project.mod_id}.devserver=quilt".toString()

def isFabricServer = { String cmd -> !cmd.contains(quiltServerMarker) }
def isQuiltServer = { String cmd -> cmd.contains(quiltServerMarker) }

def findDevServers = { Closure<Boolean> matches ->
	def running = []
	ProcessHandle.allProcesses().forEach { handle ->
		def cmd = handle.info().commandLine().orElse('')
		if (cmd.contains(loomLaunchMarker) && cmd.contains(serverEnvMarker) && matches(cmd)) {
			running << handle
		}
	}
	return running
}

def stopDevServer = { String label, Closure<Boolean> matches ->
	def running = findDevServers(matches)
	if (running.isEmpty()) {
		logger.lifecycle("No ${label} running.")
		return
	}
	// Asked to stop rather than killed: the server traps the signal and saves the world on its way
	// out, which a dev world that has been built in still deserves.
	running.each { it.destroy() }
	running.each { handle ->
		try {
			handle.onExit().get(stopRequestTimeoutSeconds, java.util.concurrent.TimeUnit.SECONDS)
			logger.lifecycle("Stopped ${label} (pid ${handle.pid()}).")
		} catch (java.util.concurrent.TimeoutException ignored) {
			throw new GradleException(
					"${label} (pid ${handle.pid()}) ignored the stop request for ${stopRequestTimeoutSeconds}s.")
		}
	}
}

tasks.register('stopServer') {
	group = 'fabric'
	description = 'Stops the dev server started by runServer, if one is running.'
	doLast { stopDevServer('dev server', isFabricServer) }
}

// --- Dev-server ports ----------------------------------------------------------------------------
// Picked on every run, never fixed per mod: the first two free ports in dev_server_ports (server,
// then rcon), written to server.properties, where devserver.sh, the bot scripts and runClient look.
def devPortBlock = project.dev_server_ports =~ /^\s*(\d+)\s*-\s*(\d+)\s*$/
if (!devPortBlock.matches()) {
	throw new GradleException("dev_server_ports must read <low>-<high>, not '${project.dev_server_ports}'.")
}
def devPorts = (devPortBlock.group(1) as int)..(devPortBlock.group(2) as int)
// A server binds only after mod init, so a pick is held this long against other run dirs, or two
// runs started together would both take the same free port.
def portClaimDir = new File(gradle.gradleUserHomeDir, 'rkc-dev-ports')
def portClaimMillis = 180_000

def portFree = { int port ->
	try {
		new ServerSocket().withCloseable { socket ->
			// Strict, so a port still in TIME_WAIT reads busy rather than failing the server's bind.
			socket.reuseAddress = false
			socket.bind(new InetSocketAddress(port))
		}
		return true
	} catch (IOException ignored) {
		return false
	}
}

def pickDevPorts = { File runDir ->
	def owner = runDir.canonicalPath
	def picked = []
	portClaimDir.mkdirs()
	def lock = new File(portClaimDir, '.lock').toPath()
	// The monitor covers parallel version nodes in this JVM; the file lock covers other builds.
	synchronized (lock.toString().intern()) {
		java.nio.channels.FileChannel.open(lock, java.nio.file.StandardOpenOption.CREATE,
				java.nio.file.StandardOpenOption.WRITE).withCloseable { channel ->
			channel.lock()
			def now = System.currentTimeMillis()
			for (port in devPorts) {
				def claim = new File(portClaimDir, "${port}")
				def claimedElsewhere = claim.exists() && now - claim.lastModified() < portClaimMillis &&
						claim.text != owner
				if (!claimedElsewhere && portFree(port)) {
					claim.text = owner
					picked << port
					if (picked.size() == 2) {
						break
					}
				}
			}
		}
	}
	if (picked.size() < 2) {
		throw new GradleException("No two free ports left in dev_server_ports (${project.dev_server_ports}).")
	}
	return picked
}

def assignDevPorts = { String label, File runDir, Closure<Boolean> matches ->
	def running = findDevServers(matches)
	if (!running.isEmpty()) {
		// Its ports are the ones in server.properties now; repicking would hide them.
		throw new GradleException("${label} is already running (pid ${running*.pid().join(', ')}).")
	}
	def (serverPort, rconPort) = pickDevPorts(runDir)
	def values = ['server-port': serverPort, 'query.port': serverPort, 'rcon.port': rconPort]
	def props = new File(runDir, 'server.properties')
	def written = [] as Set
	def lines = (props.exists() ? props.readLines() : []).collect { line ->
		def key = line.split('=', 2)[0].trim()
		if (!values.containsKey(key)) {
			return line
		}
		written << key
		return "${key}=${values[key]}".toString()
	}
	lines += values.findAll { k, v -> !written.contains(k) }.collect { k, v -> "${k}=${v}".toString() }
	props.text = lines.join('\n') + '\n'
	logger.lifecycle("${label} on port ${serverPort}, rcon ${rconPort}.")
}

// --- Optional: run the mod under Quilt Loader instead of Fabric Loader ----------------------------
// `runQuiltServer` reuses the same dev workspace as `runServer` (its own gitignored `run-quilt/`) but
// with Quilt's Knot entrypoint and quilt-loader swapped in for fabric-loader on the run classpath.
//
// PARTLY WORKING on 26.2 as last checked: it boots (Quilt Loader starts a MC 26.2 server, RCON and
// the seeded world come up) but Knot loads ONLY minecraft/quilt-loader/mixinextras — not this mod,
// fabric-api or polymer. Loom splits the mod across build/classes/java/main + build/resources/main
// and rejoins them with the `fabric.classPathGroups` sysprop, which fabric-loader reads in dev and
// Knot doesn't; there's also no quilted-fabric-loader here to pick up Fabric mods. So this currently
// smoke-tests vanilla-under-Quilt, not the mod. Fixing it needs a classPathGroups equivalent for
// Knot plus a QFL build — and Quilt has no stable 26.2 release yet. See README "Quilt dev server".
// The name the dev client joins under. Present, it does both halves of one fact at once: the
// client skips the offline-mode name prompt, and that same name is opped in the seeded ops list.
// Splitting those across two files is what left a dev client unable to set a gamerule on its own
// dev server.
def devClientUsername = project.findProperty('dev_client_username')

loom {
	runs {
		// Default client run shares run/ with runServer; both regenerate polymer/resource_pack.zip and
		// whichever finishes last wins, desyncing it from the hash the server already advertised.
		client {
			runDir 'run/client'

			if (devClientUsername) {
				programArgs '--username', devClientUsername
			}
		}
		quiltServer {
			server()
			configName = 'Quilt Server'
			runDir quiltRunDir
			// Override, not defaultMainClass: Loom otherwise takes the entrypoint from fabric-loader's
			// bundled fabric-installer.json, which names Fabric's Knot — a class this run no longer has.
			getMainClass().set('org.quiltmc.loader.impl.launch.knot.KnotServer')
			vmArgs quiltServerMarker
			ideConfigGenerated false
		}
	}
}

tasks.named('runQuiltServer', JavaExec) {
	// Hand Knot quilt-loader and its own mixin/loader stack instead of fabric-loader's: drop
	// fabric-loader plus the libs quilt ships its own copy of, so those are not on the classpath
	// twice at slightly different versions. FileCollection.filter is lazy — nothing resolves here.
	classpath = configurations.quiltLoader + classpath.filter {
		!(it.name ==~ /(fabric-loader|sponge-mixin|mixinextras-fabric)-.*\.jar/)
	}
}

tasks.register('stopQuiltServer') {
	group = 'fabric'
	description = 'Stops the dev server started by runQuiltServer, if one is running.'
	doLast { stopDevServer('Quilt dev server', isQuiltServer) }
}

// --- Dev-server defaults -------------------------------------------------------------------------
// A bare `run/` from `runServer` stops on the unaccepted EULA and has rcon off (which devserver.sh
// needs). This seeds a usable dev world once: accept the EULA, a superflat creative world with
// every experiment datapack on, rcon open, no watchdog, command blocks on, no mob spawning / block
// drops / time advance, and an ops list. Everything is merge-if-absent — a hand edit always wins,
// and `rm -rf run/` resets to these. The ports are the exception: every run picks them afresh.
def devServerOps = ['Kalic0', 'LuckySkips'] + (devClientUsername ? [devClientUsername] : [])

def seedDevServer = { File runDir ->
	runDir.mkdirs()

	def eula = new File(runDir, 'eula.txt')
	if (!eula.exists() || !eula.text.contains('eula=true')) {
		eula.text = 'eula=true\n'
	}

	// server.properties: append only the keys the file does not already mention.
	def defaults = [
			'online-mode'             : 'false',
			'gamemode'                : 'creative',
			'level-type'              : 'minecraft:flat',
			'generator-settings'      : '{"biome":"minecraft:plains","lakes":false,"features":false,' +
					'"structure_overrides":[],"layers":[{"block":"minecraft:bedrock","height":1},' +
					'{"block":"minecraft:smooth_stone","height":10}]}',
			// Every 26.2 experiment datapack. Only binds at world creation.
			'initial-enabled-packs'   : 'vanilla,minecart_improvements,redstone_experiments,trade_rebalance',
			'pause-when-empty-seconds': '0',
			'max-tick-time'           : '-1',
			'spawn-protection'        : '0',
			// Off by default in vanilla; a dev world is where command-block logic gets tried.
			'enable-command-block'    : 'true',
			'sync-chunk-writes'       : 'false',
			'enable-rcon'             : 'true',
			'rcon.password'           : project.dev_rcon_password,
			'motd'                    : "${project.mod_id} dev".toString(),
	]
	def props = new File(runDir, 'server.properties')
	def named = props.exists()
			? props.readLines().collect { it.split('=', 2)[0].trim() } as Set
			: [] as Set
	def missing = defaults.findAll { k, v -> !named.contains(k) }
	if (!missing.isEmpty()) {
		props.append(missing.collect { k, v -> "${k}=${v}" }.join('\n') + '\n')
	}

	// Op list. Offline-mode UUIDs (online-mode=false above), matching UUIDUtil.createOfflinePlayerUUID.
	// Merged per name, like server.properties above rather than the whole file at once: a mod that
	// starts naming its dev client gets it opped on the next run, not on the next `rm -rf run/`.
	def ops = new File(runDir, 'ops.json')
	def listed = ops.exists() && !ops.text.trim().isEmpty()
			? new groovy.json.JsonSlurper().parseText(ops.text)
			: []
	def opped = listed.collect { it.name } as Set
	def adding = devServerOps.findAll { !opped.contains(it) }
	if (!adding.isEmpty()) {
		ops.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
				listed + adding.collect { name -> [
						uuid               : UUID.nameUUIDFromBytes("OfflinePlayer:${name}".getBytes('UTF-8')).toString(),
						name               : name,
						level              : 4,
						bypassesPlayerLimit: false,
				] })) + '\n'
	}

	// Game rules can't be set from server.properties. Ship a tiny world datapack whose #load hook
	// applies them once per world (a storage flag guards it, so they stay editable afterwards).
	// Auto-loaded from world/datapacks/ on every boot, existing worlds included.
	def pack = new File(runDir, 'world/datapacks/zz_dev_defaults')
	if (!pack.exists()) {
		new File(pack, 'data/dev_defaults/function').mkdirs()
		new File(pack, 'data/minecraft/tags/function').mkdirs()
		// A mod that already ships its own datapacks has one pack_format property for all of them;
		// reuse it rather than making it keep a second copy in step.
		def packFormat = project.findProperty('dev_datapack_pack_format') ?: project.datapack_pack_format
		new File(pack, 'pack.mcmeta').text =
				'{"pack":{"description":"dev-server defaults","min_format":[' + packFormat +
						',1],"max_format":' + packFormat + '}}\n'
		new File(pack, 'data/minecraft/tags/function/load.json').text =
				'{"values":["dev_defaults:load"]}\n'
		new File(pack, 'data/dev_defaults/function/load.mcfunction').text =
				'execute unless data storage dev_defaults:state {applied:1b} ' +
						'run function dev_defaults:apply\n'
		new File(pack, 'data/dev_defaults/function/apply.mcfunction').text = [
				'gamerule command_blocks_work true',
				'gamerule advance_time false',
				'gamerule block_drops false',
				'gamerule spawn_mobs false',
				'gamerule spawn_monsters false',
				'gamerule spawn_patrols false',
				'gamerule spawn_phantoms false',
				'gamerule spawn_wandering_traders false',
				'gamerule spawn_wardens false',
				'data modify storage dev_defaults:state applied set value 1b',
				'',
		].join('\n')
	}
}

// The client run (run/client, see the loom { runs { client { ... } } } block above) has no mods/ of
// its own — it symlinks to run/mods so it sees the same third-party mods as the dev server without
// duplicating jars. Loom recreates run/client/mods as a plain directory if it's missing (e.g. after
// wiping run/client/), so re-link it before every runClient rather than relying on it staying put.
def ensureClientModsSymlink = {
	// The symlink's target has to exist first: Fabric Loader's own mod discovery treats a dangling
	// symlink as absent and tries `Files.createDirectory` on it, which throws
	// FileAlreadyExistsException on a path that already exists as a (broken) link. Matters when
	// runClient is the very first task run in a checkout, before runServer has ever created run/mods.
	file(devRunDir).mkdirs()
	file("${devRunDir}/mods").mkdirs()

	def modsDir = file("${devRunDir}/client/mods")
	def modsPath = modsDir.toPath()
	if (java.nio.file.Files.isSymbolicLink(modsPath)) {
		return
	}
	if (modsDir.exists()) {
		if (modsDir.isDirectory() && modsDir.list().length == 0) {
			modsDir.delete()
		} else {
			logger.warn("${modsPath} exists and is not an empty directory; leaving it as-is instead " +
					'of symlinking it to run/mods.')
			return
		}
	}
	modsDir.parentFile.mkdirs()
	java.nio.file.Files.createSymbolicLink(modsPath, java.nio.file.Paths.get('../mods'))
}

tasks.register('configureRunServer') {
	group = 'fabric'
	description = 'Seeds run/ and run-quilt/ with EULA acceptance and sane dev-server defaults.'
	doLast {
		seedDevServer(file(devRunDir))
		seedDevServer(file(quiltRunDir))
	}
}

// A bare run/client stops at the accessibility onboarding screen, the multiplayer safety warning
// and an empty server list, and defaults music to full volume — none of which help a dev client
// that only ever points at this mod's own dev server. Same merge-if-absent rule as seedDevServer: a
// hand edit always wins, and `rm -rf run/client/` resets to these.
def seedDevClient = { File runDir, String serverPort ->
	runDir.mkdirs()

	def defaults = [
			// Without this the file reads as schema 0, so Minecraft replays every options datafix
			// over it — OptionsKeyLwjgl3Fix then parseInts the key_ values and Options.load bails.
			version               : project.dev_client_options_version,
			onboardAccessibility  : 'false',
			skipMultiplayerWarning: 'true',
			joinedFirstServer     : 'true',
			soundCategory_music   : '0.0',
	]
	def optionsFile = new File(runDir, 'options.txt')
	def named = optionsFile.exists()
			? optionsFile.readLines().collect { it.split(':', 2)[0].trim() } as Set
			: [] as Set
	def missing = defaults.findAll { k, v -> !named.contains(k) }
	if (!missing.isEmpty()) {
		optionsFile.append(missing.collect { k, v -> "${k}:${v}" }.join('\n') + '\n')
	}

	// servers.dat is NBT, not text, and net.minecraft classes aren't on the buildscript classpath
	// (Loom only maps them onto the mod's own compile/run classpath) — so this writes the handful of
	// tags ServerData/ServerList actually read (root compound -> "servers" list -> one compound with
	// "name"/"ip" strings) by hand instead of going through Mojang's writer.
	if (serverPort == null) {
		return  // No dev server has run yet, so there is no port to point at.
	}
	def serverName = "${project.mod_id} dev".toString()
	def serverIp = "localhost:${serverPort}".toString()
	def serversFile = new File(runDir, 'servers.dat')
	if (serversFile.exists()) {
		// The entry follows the server's port. NBT has no length above a string's own, so the client's
		// re-saved file is patched in place, keeping its pack choice — only while it lists just ours.
		def latin1 = { List<Integer> bytes -> new String(bytes as byte[], 'ISO-8859-1') }
		def stringTag = { String name, String value ->
			latin1([0x08, 0, name.length()]) + name + latin1([value.length() >> 8, value.length() & 0xFF]) + value
		}
		def nbt = new String(serversFile.bytes, 'ISO-8859-1')
		// Bytes 13-17: the servers list's element type (compound) and count (1).
		def onlyOurs = nbt.length() > 18 && nbt.substring(13, 18) == latin1([0x0A, 0, 0, 0, 1]) &&
				nbt.contains(stringTag('name', serverName))
		def patched = nbt.replaceFirst(/\x08\x00\x02ip[\x00-\xFF]{2}localhost:\d+/,
				java.util.regex.Matcher.quoteReplacement(stringTag('ip', serverIp)))
		if (onlyOurs && patched != nbt) {
			serversFile.bytes = patched.getBytes('ISO-8859-1')
		}
	} else {
		def writeNbtString = { DataOutputStream out, String s ->
			def bytes = s.getBytes('UTF-8')
			out.writeShort(bytes.length)
			out.write(bytes)
		}
		serversFile.withDataOutputStream { out ->
			out.writeByte(0x0A)  // TAG_Compound (root, unnamed)
			out.writeShort(0)
			out.writeByte(0x09)  // TAG_List
			writeNbtString(out, 'servers')
			out.writeByte(0x0A)  // list element type: TAG_Compound
			out.writeInt(1)      // element count
			out.writeByte(0x08)  // TAG_String
			writeNbtString(out, 'name')
			writeNbtString(out, serverName)
			out.writeByte(0x08)  // TAG_String
			writeNbtString(out, 'ip')
			writeNbtString(out, serverIp)
			out.writeByte(0x00)  // TAG_End: closes the list element
			out.writeByte(0x00)  // TAG_End: closes the root compound
		}
	}
}

tasks.register('configureRunClient') {
	group = 'fabric'
	description = 'Symlinks run/client/mods to run/mods and seeds run/client with dev-client defaults.'
	doLast {
		ensureClientModsSymlink()
		def serverProps = file("${devRunDir}/server.properties")
		def serverPort = serverProps.exists()
				? serverProps.readLines().findResult { it.startsWith('server-port=') ? it.substring(12).trim() : null }
				: null
		seedDevClient(file("${devRunDir}/client"), serverPort)
	}
}

// doFirst, not configureRunServer: that may run before compiling, long before the server binds.
tasks.named('runServer') {
	dependsOn 'configureRunServer'
	doFirst { assignDevPorts('Dev server', file(devRunDir), isFabricServer) }
}
tasks.named('runQuiltServer') {
	dependsOn 'configureRunServer'
	doFirst { assignDevPorts('Quilt dev server', file(quiltRunDir), isQuiltServer) }
}
tasks.named('runClient') { dependsOn 'configureRunClient' }
